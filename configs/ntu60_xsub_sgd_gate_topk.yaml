# I-6d — Gated cross-view transmission: top-k sparse confidence · NTU60 · 65ep.
# Most aggressive selectivity: confidence gate hard-masked to the 5 joints with
# the lowest HRNet confidence per (sample, view, person).  Pure structural
# sparsity (`topo`) hurts; this tests whether the *binary*/sparse extreme of
# confidence gating is better, comparable, or worse than the soft version.

dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
batch_size:     32
accumulate_grad_batches: 2
num_workers:    8
window_size:    100
temporal_sampling: uniform
max_person:     2

num_class:      60
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
sa_mode:           none
gated_cross_view:  conf_topk
aux_weight:     0.3

optimizer:      sgd
base_lr:        0.1
weight_decay:   5.0e-4
max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-sgd-gate-topk5-65ep
wandb_tags:     [ntu60, xsub, sgd, 65ep, I-6, gate_topk, uniform100]
