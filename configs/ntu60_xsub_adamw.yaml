# MUST-GCN · NTU60 X-Sub · AdamW · CTR-GCN-faithful schedule (65 epochs)
#
# AdamW is recommended for the hybrid GCN + MHA architecture: less hyperparameter
# sensitivity than SGD for the attention layers, similar final accuracy in
# practice.  See `design-discussion.md` for the optimiser-choice discussion.
#
# Schedule shape (CTR-GCN-faithful):
#   epoch  0–4   linear warmup from 0 → base_lr
#   epoch  5–34  base_lr
#   epoch 35–54  base_lr × 0.1
#   epoch 55–64  base_lr × 0.01

# --- data
train_split: xsub_train
val_split:   xsub_val
batch_size:  64
num_workers: 8
window_size: 64
max_person:  2

# --- model
num_class:    60
num_point:    17
num_views:    3
graph:        graph.coco17.Graph
base_channel: 64
num_heads:    4
drop_out:     0.0
attn_dropout: 0.0

# --- loss (per design O9)
aux_weight: 0.3

# --- optimisation
optimizer:    adamw
base_lr:      3.0e-4
weight_decay: 1.0e-2

# --- schedule
max_epochs:    65
warmup_epochs: 5
step_epochs:   [35, 55]
lr_decay_rate: 0.1
grad_clip:     1.0

# --- trainer
gpus:      1
precision: bf16-mixed
log_dir:   ./lightning_logs

# --- WandB
wandb_project: MUST-GCN
wandb_name:    ntu60-xsub-adamw-65ep
wandb_tags:    [ntu60, xsub, adamw, 65ep, baseline]
