# MUST-GCN · NTU60 X-Sub · AdamW · 65 ep · NO aug · SA = weighted_sum
#
# D-priority fill — completes the SA-mode 2x2 (NTU60 didn't have any
# SA-mode ablations beyond the default mha h=4).

dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    8
window_size:    64
max_person:     2

num_class:      60
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      4                  # ignored by weighted_sum at SA; still used by TA
data_bn_mode:   shared
sa_mode:        weighted_sum

aux_weight:     0.3

optimizer:      adamw
base_lr:        3.0e-4
weight_decay:   1.0e-2

max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-adamw-wsum-65ep
wandb_tags:     [ntu60, xsub, adamw, 65ep, ablation, sa_weighted_sum]
