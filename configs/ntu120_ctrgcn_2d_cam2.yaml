# Exp 1 — CTR-GCN 2D baseline · NTU120 X-Sub · single-view (camera 2)
#
# NTU120 variant of the original-CTR-GCN 2D baseline.  Same PYSKL recipe.

model_arch:    ctrgcn
dataset:       ntu120
train_split:   xsub_train
val_split:     xsub_val
select_camera: 2
squeeze_view:  true
batch_size:    128
num_workers:   4
window_size:   64
max_person:    2

num_class:     120
num_point:     17
graph:         graph.coco17.Graph
base_channel:  64

optimizer:     sgd
base_lr:       0.1
weight_decay:  4.0e-4
lr_schedule:   cosine
max_epochs:    80
warmup_epochs: 5
grad_clip:     1.0

gpus:          1
precision:     bf16-mixed
log_dir:       ./lightning_logs

wandb_project: MUST-GCN
wandb_name:    ntu120-ctrgcn-2d-cam2-80ep
wandb_tags:    [ntu120, xsub, ctrgcn, baseline, 2d, single_view, 80ep]
