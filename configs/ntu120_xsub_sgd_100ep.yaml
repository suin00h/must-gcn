# MUST-GCN · NTU120 X-Sub · SGD-Nesterov · 100 ep · NO augmentation
#
# Headline candidate.  If `ntu120_xsub_sgd.yaml` (SGD, 65 ep) beats AdamW
# at 80.09 %, this extends the winner to 100 ep to squeeze the last bit
# of accuracy.  Combines:
#   - best optimiser from NTU60 (SGD +2.35 % over AdamW)
#   - best schedule on NTU120 (100 ep gave +0.44 % over 65 ep on the
#     adamw+aug branch)
#   - no aug (which was net-harmful on AdamW; assumed same for SGD until
#     `ntu120_xsub_sgd_aug.yaml` proves otherwise)

# --- data
dataset:        ntu120
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    8
window_size:    64
max_person:     2

# --- model
num_class:      120
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      4
data_bn_mode:   shared
sa_mode:        mha

# --- loss
aux_weight:     0.3

# --- optimisation
optimizer:      sgd
base_lr:        0.1
weight_decay:   4.0e-4

# --- schedule (extended)
max_epochs:     100
warmup_epochs:  5
step_epochs:    [50, 80]
lr_decay_rate:  0.1
grad_clip:      1.0

# --- trainer
gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

# --- WandB
wandb_project:  MUST-GCN
wandb_name:     ntu120-xsub-sgd-100ep
wandb_tags:     [ntu120, xsub, sgd, 100ep, long]
