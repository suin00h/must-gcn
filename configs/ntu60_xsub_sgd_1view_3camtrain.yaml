# Exp 2 — single-view MUST-GCN trained on all 3 cameras as separate samples
#
# MUST-GCN with num_views=1, sa_mode=none.  Training enumerates every
# (group, camera) as an independent sample (3× the data); inference uses
# camera 2 only.
#
# Purpose: disentangle MUST-GCN's multi-view gain —
#   test_acc1 ≈ multi-view  → gain is training-time view diversity
#   test_acc1 ≪ multi-view  → gain is inference-time view ensemble

dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
expand_views:   true              # TRAIN: 3 cams as independent samples
select_camera:  2                 # VAL/TEST: camera 2 only
num_views:      1
batch_size:     64
num_workers:    4
window_size:    64
max_person:     2

num_class:      60
num_point:      17
num_views:      1
graph:          graph.coco17.Graph
base_channel:   64
sa_mode:        none

aux_weight:     0.3               # num_views=1 → aux == main, harmless

optimizer:      sgd
base_lr:        0.1
weight_decay:   4.0e-4
max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-sgd-1view-3camtrain-65ep
wandb_tags:     [ntu60, xsub, sgd, 65ep, exp2, single_view, 3cam_train, uniform100]
