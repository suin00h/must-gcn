# Proper Perceiver-style cross-view bottleneck — gather-then-scatter · NTU120.
# NTU120 counterpart of ntu60_xsub_sgd_bottle_gather.yaml.

dataset:        ntu120
train_split:    xsub_train
val_split:      xsub_val
batch_size:     32
accumulate_grad_batches: 2
num_workers:    8
window_size:    100
temporal_sampling: uniform
max_person:     2

num_class:      120
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
sa_mode:        cross_bottle_gather
aux_weight:     0.3

optimizer:      sgd
base_lr:        0.1
weight_decay:   5.0e-4
max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

wandb_project:  MUST-GCN
wandb_name:     ntu120-xsub-sgd-bottle-gather-65ep
wandb_tags:     [ntu120, xsub, sgd, 65ep, ablation, sa_bottle_gather, uniform100]
