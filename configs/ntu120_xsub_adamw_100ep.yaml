# MUST-GCN · NTU120 X-Sub · AdamW · 100 ep · NO augmentation
#
# Schedule-effect isolation.  Pairs with:
#   `ntu120_xsub_adamw.yaml`           — AdamW, no aug,  65 ep  (got 80.09 %)
#   `ntu120_xsub_adamw_aug.yaml`       — AdamW, aug,    65 ep  (got 78.96 %)
#   `ntu120_xsub_adamw_aug_100ep.yaml` — AdamW, aug,   100 ep  (got 79.40 %)
#
# This config completes the 2×2 (aug × schedule) so we can read out:
#   aug effect           = (aug 100ep) − (no-aug 100ep)
#   schedule effect      = (no-aug 100ep) − (no-aug 65ep)
#   interaction          = leftover

# --- data
dataset:        ntu120
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    8
window_size:    64
max_person:     2

# --- model
num_class:      120
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      4
data_bn_mode:   shared
sa_mode:        mha

# --- loss
aux_weight:     0.3

# --- optimisation
optimizer:      adamw
base_lr:        3.0e-4
weight_decay:   1.0e-2

# --- schedule (extended)
max_epochs:     100
warmup_epochs:  5
step_epochs:    [50, 80]
lr_decay_rate:  0.1
grad_clip:      1.0

# --- trainer
gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

# --- WandB
wandb_project:  MUST-GCN
wandb_name:     ntu120-xsub-adamw-100ep
wandb_tags:     [ntu120, xsub, adamw, 100ep, long]
