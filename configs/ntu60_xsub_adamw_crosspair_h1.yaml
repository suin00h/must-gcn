# MUST-GCN · NTU60 X-Sub · AdamW · 65 ep · NO aug · SA = pairwise cross-attn (1 head)
#
# Head-count sweep for Option A (pairwise cross-attn).  With only 1 head
# and a KV sequence of 2 tokens, each head sees the full feature dim
# (head_dim = C_l) — the maximally-undivided cross-attn.

# --- data
dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    8
window_size:    64
max_person:     2

# --- model
num_class:      60
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      1                  # 1-head pairwise cross-attn
data_bn_mode:   shared
sa_mode:        cross_pair

# --- loss
aux_weight:     0.3

# --- optimisation
optimizer:      sgd
base_lr:        3.0e-4
weight_decay:   1.0e-2

# --- schedule
max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

# --- trainer
gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

# --- WandB
wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-sgd-crosspair-h1-65ep
wandb_tags:     [ntu60, xsub, sgd, 65ep, ablation, sa_cross_pair, h1, uniform100]
