# MUST-GCN · NTU60 X-Sub · AdamW · 65 ep · NO aug · per-view GCN+TA, shared SA (Option 0)
#
# 3× independent GCN+TA backbones (one per camera view), bridged only by the
# shared SA at every block.  Tests whether view-invariant shared weights are
# *under-fitting* each view, and whether view-specific weights + per-block
# shared SA recovers a real cross-view benefit.
#
# Params: ~9.4 M (vs ~3.9 M shared baseline) — 2.4× more, all in GCN+TA.

dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    4                  # RAM-safety vs root sweep
window_size:    64
max_person:     2

num_class:      60
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      2
data_bn_mode:   shared
sa_mode:        mha
view_weights:   separate           # <— Option 0

aux_weight:     0.3

optimizer:      sgd
base_lr:        3.0e-4
weight_decay:   1.0e-2

max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-sgd-view-sep-65ep
wandb_tags:     [ntu60, xsub, sgd, 65ep, ablation, view_separate, option0, uniform100]
