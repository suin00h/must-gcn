# MUST-GCN · NTU120 X-Sub · SGD-Nesterov · 65 ep · WITH augmentation
#
# Cross-check: under AdamW, aug lowered NTU120 acc by 1.13 %.  Does SGD
# interact with aug the same way, or does the weight-decay-regularised
# optimiser handle the augmented distribution better?
#
# This pairs with `ntu120_xsub_sgd.yaml` (no aug) the same way
# `ntu120_xsub_adamw_aug.yaml` pairs with `ntu120_xsub_adamw.yaml`.

# --- data
dataset:        ntu120
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    8
window_size:    64
max_person:     2

# --- augmentation (rot ±15° + h-flip + shear)
random_rot:     true
random_flip:    true
random_shear:   true

# --- model
num_class:      120
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      4
data_bn_mode:   shared
sa_mode:        mha

# --- loss
aux_weight:     0.3

# --- optimisation
optimizer:      sgd
base_lr:        0.1
weight_decay:   4.0e-4

# --- schedule
max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

# --- trainer
gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

# --- WandB
wandb_project:  MUST-GCN
wandb_name:     ntu120-xsub-sgd-aug-65ep
wandb_tags:     [ntu120, xsub, sgd, 65ep, aug]
