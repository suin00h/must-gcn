# MUST-GCN · NTU60 X-Sub · SGD-Nesterov · 100 ep · NO aug · SA = Identity
#
# Headline-candidate config — combines all three "wins" from phase-2:
#   - SGD-Nesterov (+0.4 % over AdamW on NTU120, +1.0 % on NTU60)
#   - 100 ep schedule  (+1.2 % over 65 ep on NTU60 SGD)
#   - sa_mode=none     (≥ all per-block cross-view variants on both datasets)
#
# Pairs against:
#   ntu60_xsub_sgd_long.yaml         (same recipe, sa_mode=mha) → 89.68 %
#   ntu60_xsub_adamw_none.yaml       (same recipe, AdamW + 65 ep) → 88.45 %

# --- data
dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
batch_size:     32
accumulate_grad_batches: 2
num_workers:    8
window_size:    100
max_person:     2

# --- model
num_class:      60
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      4                  # ignored by SA when sa_mode=none; still used by TA
data_bn_mode:   shared
sa_mode:        none               # <— Identity at every block

# --- loss
aux_weight:     0.3

# --- optimisation (CTR-GCN paper defaults)
optimizer:      sgd
base_lr:        0.1
weight_decay:   5.0e-4

# --- schedule (extended)
max_epochs:     100
warmup_epochs:  5
step_epochs:    [50, 80]
lr_decay_rate:  0.1
grad_clip:      1.0

# --- trainer
gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

# --- WandB
wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-sgd-long-none-100ep
wandb_tags:     [ntu60, xsub, sgd, 100ep, long, ablation, sa_none, headline_candidate, uniform100]
