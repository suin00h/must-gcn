# MUST-GCN · NTU120 X-Sub · AdamW · 65 epochs
#
# Uses ntu120_hrnet.pkl.  120 classes ⇒ bigger softmax + harder problem,
# but otherwise the same recipe.  Consider extending to 100 epochs if val
# accuracy is still climbing.

# --- data
dataset:     ntu120         # resolves to $DATA_ROOT/ntu-rgbd/processed/hrnet/ntu120_hrnet.pkl
train_split: xsub_train
val_split:   xsub_val
batch_size:  64
num_workers: 8
window_size: 64
max_person:  2

# --- model
num_class:    120
num_point:    17
num_views:    3
graph:        graph.coco17.Graph
base_channel: 64
num_heads:    4
drop_out:     0.0
attn_dropout: 0.0

# --- loss
aux_weight: 0.3

# --- optimisation
optimizer:    sgd
base_lr:      3.0e-4
weight_decay: 1.0e-2

# --- schedule
max_epochs:    65
warmup_epochs: 5
step_epochs:   [35, 55]
lr_decay_rate: 0.1
grad_clip:     1.0

# --- trainer
gpus:      1
precision: bf16-mixed
log_dir:   ./lightning_logs

# --- WandB
wandb_project: MUST-GCN
wandb_name:    ntu120-xsub-sgd-65ep
wandb_tags:    [ntu120, xsub, sgd, 65ep, baseline, uniform100]
