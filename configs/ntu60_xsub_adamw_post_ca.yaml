# MUST-GCN · NTU60 X-Sub · AdamW · 65 ep · NO aug · Phase-5 Option A
#
# Post-backbone cross-attention.  Backbone runs sa_mode=none (each view fully
# independent through all 10 blocks); a single cross-view attention fires on
# the pooled features, between the (T,V) pool and the FC head.
#
# Success criterion: beats `none` baseline (88.45 %) on NTU60 X-Sub.

dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    4
window_size:    64
max_person:     2

num_class:      60
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      2
data_bn_mode:   shared
sa_mode:        none               # backbone fully independent per view
post_backbone_ca: true             # <— Option A: one cross-view attn on pooled features

aux_weight:     0.3

optimizer:      sgd
base_lr:        3.0e-4
weight_decay:   1.0e-2

max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-sgd-post-ca-65ep
wandb_tags:     [ntu60, xsub, sgd, 65ep, phase5, post_backbone_ca, optionA, uniform100]
