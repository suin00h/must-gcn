# MUST-GCN · NTU60 X-Sub · AdamW · 65 ep · NO aug · + InputLevelCVA (Option 1)
#
# Adds cross-view attention at the RAW INPUT level (C_in=3 channels), before
# any GCN abstraction.  Goes between `data_bn` and the first block.
# Keeps standard `sa_mode=mha` so we can isolate the input-fusion effect.
#
# +~17 k params (proj_in + small attn + proj_out).

dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    8
window_size:    64
max_person:     2

num_class:      60
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      2
data_bn_mode:   shared
sa_mode:        mha
input_level_cva: true              # <— Option 1

aux_weight:     0.3

optimizer:      sgd
base_lr:        3.0e-4
weight_decay:   1.0e-2

max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-sgd-input-cva-65ep
wandb_tags:     [ntu60, xsub, sgd, 65ep, ablation, input_level_cva, option1, uniform100]
