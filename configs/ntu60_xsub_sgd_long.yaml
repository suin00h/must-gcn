# MUST-GCN · NTU60 X-Sub · SGD-Nesterov · 100 ep · NO augmentation
#
# Mirrors `ntu60_xsub_adamw_long.yaml` (AdamW · 100 ep) and
# `ntu120_xsub_sgd_100ep.yaml` (NTU120 · SGD · 100 ep).
# Headline-candidate for NTU60: combines SGD (which beat AdamW by +2.35 % at
# 65 ep) with the extended schedule.

# --- data
dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    8
window_size:    64
max_person:     2

# --- model
num_class:      60
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      4
data_bn_mode:   shared
sa_mode:        mha

# --- loss
aux_weight:     0.3

# --- optimisation
optimizer:      sgd
base_lr:        0.1
weight_decay:   4.0e-4

# --- schedule (extended)
max_epochs:     100
warmup_epochs:  5
step_epochs:    [50, 80]
lr_decay_rate:  0.1
grad_clip:      1.0

# --- trainer
gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

# --- WandB
wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-sgd-long-100ep
wandb_tags:     [ntu60, xsub, sgd, 100ep, long, uniform100]
