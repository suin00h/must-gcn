# MUST-GCN · NTU60 X-Sub · AdamW · 65 ep · NO aug · SA = joint-level cross-view
#
# Option 2: tokens are V_joints=17 instead of V_views=3.  Each view's joint
# embeddings attend to other views' joint embeddings, preserving the
# joint-level spatial structure that the current SA's 3-view channel-vector
# attention washes out.
#
# Pairs against `ntu60_xsub_sgd.yaml` (mha) and `ntu60_xsub_sgd_none.yaml`
# (no cross-view) for direct comparison.

dataset:        ntu60
train_split:    xsub_train
val_split:      xsub_val
batch_size:     64
num_workers:    8
window_size:    64
max_person:     2

num_class:      60
num_point:      17
num_views:      3
graph:          graph.coco17.Graph
base_channel:   64
num_heads:      2                  # 17-token seq; heads=2 keeps head_dim healthy
data_bn_mode:   shared
sa_mode:        joint_cross        # <— Option 2

aux_weight:     0.3

optimizer:      sgd
base_lr:        3.0e-4
weight_decay:   1.0e-2

max_epochs:     65
warmup_epochs:  5
step_epochs:    [35, 55]
lr_decay_rate:  0.1
grad_clip:      1.0

gpus:           1
precision:      bf16-mixed
log_dir:        ./lightning_logs

wandb_project:  MUST-GCN
wandb_name:     ntu60-xsub-sgd-joint-cross-65ep
wandb_tags:     [ntu60, xsub, sgd, 65ep, ablation, sa_joint_cross, option2, uniform100]
